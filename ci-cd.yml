name: Node.js CI/CD Pipeline

# 1. Triggers: When should this script run?
on:
  push:
    branches: [ "main" ]    # Triggers when code is pushed to main
  pull_request:
    branches: [ "main" ]    # Triggers when a PR is opened against main

# 2. Execution Units
jobs:
  # Job 1: Build and Test (Continuous Integration)
  build-and-test:
    runs-on: ubuntu-latest  # Runs on a fresh cloud VM hosted by GitHub

    steps:
      # Step 1: Clone the repository code onto the runner
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Provision the programming environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'      # Caches dependencies to speed up future runs

      # Step 3: Install project modules
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run automated validation scripts
      - name: Run Tests
        run: npm test

  # Job 2: Deploy (Continuous Delivery/Deployment)
  deploy:
    needs: build-and-test   # Requires the test job to pass before running
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Only deploy on true main merges

    steps:
      - name: Mock Deploy Step
        run: echo "Deploying application to production server..."
        # In reality, you would use cloud providers like AWS, Azure, or hosting platforms here
