name: NestJS CI/CD Pipeline

on:
  push:
    branches: [ main, develop, cicd ]
  pull_request:
    branches: [ main, develop, cicd ]

jobs:
  continuous-integration:
    name: Continuous Integration (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality (Linting)
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build Application
        run: npm run build

  continuous-deployment:
    name: Continuous Deployment (CD)
    needs: continuous-integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Example: Deploying via a Webhook (e.g., Render, Railway, or Heroku)
      # You can replace this section depending on your hosting infrastructure
      - name: Deploy to Hosting Provider
        run: |
          curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
